name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20
          - 22
    defaults:
      run:
        shell: bash
    env:
      # CI 里浏览器用例不允许跳过：跳过等于失败。
      AGENTFORGE_REQUIRE_BROWSER_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Prepare log directory
        run: mkdir -p artifacts

      - name: Syntax check
        run: |
          set -o pipefail
          npm run check:syntax 2>&1 | tee "artifacts/syntax-${RUNNER_OS}-node-${{ matrix.node }}.log"

      - name: Type gate
        run: npm run check:types

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee "artifacts/coverage-${RUNNER_OS}-node-${{ matrix.node }}.log"

      - name: Browser availability
        run: |
          set -e
          found=""
          for candidate in \
            "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
            "/c/Program Files/Microsoft/Edge/Application/msedge.exe" \
            "/c/Program Files/Google/Chrome/Application/chrome.exe" \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/usr/bin/google-chrome" \
            "/usr/bin/google-chrome-stable" \
            "/usr/bin/chromium" \
            "/usr/bin/chromium-browser"; do
            if [ -x "$candidate" ]; then found="$candidate"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::CI 需要真实浏览器运行 DOM 验收；未找到 Edge/Chrome"
            exit 1
          fi
          echo "browser: $found"

      - name: Test
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee "artifacts/test-${RUNNER_OS}-node-${{ matrix.node }}.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ runner.os }}-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: warn
