name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20
          - 22
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Prepare log directory
        run: mkdir -p artifacts

      - name: Syntax check
        run: |
          set -o pipefail
          npm run check:syntax 2>&1 | tee "artifacts/syntax-${RUNNER_OS}-node-${{ matrix.node }}.log"

      - name: Test
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee "artifacts/test-${RUNNER_OS}-node-${{ matrix.node }}.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ runner.os }}-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: warn
